<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AJAX API Template</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; padding: 30px; }
    .card { margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="text-center mb-4">📡 API Data Fetcher</h1>

    <!-- Input Section -->
    <div class="input-group mb-3">
      <input type="text" id="queryInput" class="form-control" placeholder="Enter city or keyword">
      <button class="btn btn-primary" onclick="fetchAPIData()">Fetch Data</button>
    </div>

    <!-- Results -->
    <div id="results" class="row"></div>
  </div>

  <script>
    async function fetchAPIData() {
      const query = document.getElementById("queryInput").value;
      const apiKey = "bd5e378503939ddaee76f12ad7a97608";
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${query}&appid=${apiKey}&units=metric`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.cod === 200) {
          document.getElementById("results").innerHTML = `
            <div class="col-md-6 offset-md-3">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h5 class="card-title">🌍 ${data.name}, ${data.sys.country}</h5>
                  <p class="card-text">🌡️ Temp: <strong>${data.main.temp}°C</strong></p>
                  <p class="card-text">☁️ Condition: ${data.weather[0].description}</p>
                  <p class="card-text">💧 Humidity: ${data.main.humidity}%</p>
                  <p class="card-text">💨 Wind: ${data.wind.speed} m/s</p>
                </div>
              </div>
            </div>
          `;
        } else {
          document.getElementById("results").innerHTML = `<p class="text-danger text-center">City not found.</p>`;
        }
      } catch (err) {
        document.getElementById("results").innerHTML = `<p class="text-danger text-center">Error fetching data.</p>`;
      }
    }
  </script>

</body>
</html>
