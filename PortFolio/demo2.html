<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Work - Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --accent-color: #4e9af1;
    }

    body.dark {
      --bg-color: #1a1a1a;
      --text-color: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.4s ease, color 0.4s ease;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .projects-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .project {
      background-color: #f5f5f5;
      border-radius: 10px;
      padding: 1rem;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    body.dark .project {
      background-color: #2c2c2c;
    }

    .project:hover {
      transform: scale(1.03);
      background: var(--accent-color);
      color: white;
    }

    .back-btn {
      display: inline-block;
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      border: 2px solid var(--accent-color);
      border-radius: 5px;
      color: var(--accent-color);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--accent-color);
      color: white;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="demo.html">← Back to Home</a>
  <h1>My Projects</h1>
  <div class="projects-container">
    <div class="project">
      <h2>Project One</h2>
      <p>A responsive portfolio site using HTML, CSS, and JavaScript.</p>
    </div>
    <div class="project">
      <h2>Project Two</h2>
      <p>Weather app using AJAX and OpenWeather API for real-time updates.</p>
    </div>
    <div class="project">
      <h2>Project Three</h2>
      <p>Task management tool with local storage and dynamic UI.</p>
    </div>
  </div>

  <script>
    // Optional: Enable dark mode if coming from main site with dark mode
    if (window.localStorage.getItem('darkMode') === 'enabled') {
      document.body.classList.add('dark');
    }
  </script>
</body>
</html>
