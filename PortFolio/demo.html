<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --accent-color: #4e9af1;
    }

    body.dark {
      --bg-color: #1a1a1a;
      --text-color: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--bg-color);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .toggle-btn {
      background: none;
      border: 2px solid var(--accent-color);
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      color: var(--accent-color);
      transition: background 0.3s ease;
    }

    .toggle-btn:hover {
      background: var(--accent-color);
      color: white;
    }

    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 600px;
    }

    .hero a {
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      background: var(--accent-color);
      color: white;
      border-radius: 5px;
      transition: background 0.3s ease;
    }

    .hero a:hover {
      background: #3478c7;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">MyPortfolio</div>
    <button class="toggle-btn" id="modeToggle">Toggle Dark Mode</button>
  </header>
  <section class="hero">
    <h1>Hi, I'm Jane Doe</h1>
    <p>Creative Web Developer passionate about crafting beautiful and functional websites.</p>
    <a href="demo2.html">View My Work</a>
  </section>

  <script>
    const toggleBtn = document.getElementById('modeToggle');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });
  </script>
</body>
</html>
